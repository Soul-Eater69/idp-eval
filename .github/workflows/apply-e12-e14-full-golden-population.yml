name: Apply E12-E14 full golden population

on:
  push:
    branches: [main]
    paths:
      - 'l3_experiments/_apply_e12_e14_full_golden_population.py'
      - '.github/workflows/apply-e12-e14-full-golden-population.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update notebooks
        run: python l3_experiments/_apply_e12_e14_full_golden_population.py

      - name: Run structural test
        run: python l3_experiments/_test_e12_e14_full_golden_population.py

      - name: Commit notebooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            l3_experiments/00_fetch_full_golden_ground_truth.ipynb \
            l3_experiments/12_business_needs_stage_custom_prompt.ipynb \
            l3_experiments/13_theme_description_stage_custom_prompt.ipynb \
            l3_experiments/14_theme_needs_description_stage_custom_prompt.ipynb
          if git diff --cached --quiet; then
            echo "No notebook changes to commit."
            exit 0
          fi
          git commit -m "Use fixed 50 valid full-golden Epics for E12-E14"
          git push
