name: Apply enhanced and batch experiments

on:
  push:
    branches: [main]
    paths:
      - 'l3_experiments/_apply_enhanced_and_batch_experiments.py'
      - '.github/workflows/apply-enhanced-and-batch-experiments.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate experiment notebooks
        run: python l3_experiments/_apply_enhanced_and_batch_experiments.py
      - name: Verify generated notebooks
        run: python l3_experiments/_test_enhanced_and_batch_experiments.py
      - name: Commit notebooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            l3_experiments/12_business_needs_stage_enhanced_prompt.ipynb \
            l3_experiments/14_theme_needs_description_stage_enhanced_prompt.ipynb \
            l3_experiments/15_theme_needs_description_theme_batch_custom_prompt.ipynb \
            l3_experiments/16_business_needs_theme_batch_custom_prompt.ipynb
          if git diff --cached --quiet; then
            echo "No notebook changes to commit."
            exit 0
          fi
          git commit -m "Add enhanced and theme batch L3 experiments"
          git push

# Regenerate after IDs-only verification refinement.
