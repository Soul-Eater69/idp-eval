name: Apply full golden validity

on:
  push:
    branches: [main]
    paths:
      - 'l3_experiments/_apply_full_golden_validity.py'
      - '.github/workflows/apply-full-golden-validity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update notebook
        run: python l3_experiments/_apply_full_golden_validity.py

      - name: Run validity structural test
        run: python l3_experiments/_test_full_golden_validity.py

      - name: Commit notebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add l3_experiments/00_fetch_full_golden_ground_truth.ipynb
          if git diff --cached --quiet; then
            echo "No notebook changes to commit."
            exit 0
          fi
          git commit -m "Add GT candidate validity check"
          git push
