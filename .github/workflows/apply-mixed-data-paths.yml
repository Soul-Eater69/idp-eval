name: Apply mixed experiment data paths

on:
  push:
    branches: [main]
    paths:
      - 'l3_experiments/_apply_mixed_data_paths.py'
      - '.github/workflows/apply-mixed-data-paths.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update notebooks
        run: python l3_experiments/_apply_mixed_data_paths.py

      - name: Run regression test
        run: python l3_experiments/_test_mixed_data_paths.py

      - name: Commit notebooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            l3_experiments/12_business_needs_stage_custom_prompt.ipynb \
            l3_experiments/13_theme_description_stage_custom_prompt.ipynb \
            l3_experiments/14_theme_needs_description_stage_custom_prompt.ipynb
          if git diff --cached --quiet; then
            echo "No notebook changes to commit."
            exit 0
          fi
          git commit -m "Resolve E12-E14 data files across notebook and repo folders"
          git push
