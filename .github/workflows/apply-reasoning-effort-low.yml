name: Apply low reasoning effort

on:
  push:
    branches: [main]
    paths:
      - 'l3_experiments/_apply_reasoning_effort_low.py'
      - '.github/workflows/apply-reasoning-effort-low.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update common and notebooks
        run: python l3_experiments/_apply_reasoning_effort_low.py
      - name: Verify low reasoning effort
        run: python l3_experiments/_test_reasoning_effort_low.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            l3_experiments/common.py \
            l3_experiments/12_business_needs_stage_custom_prompt.ipynb \
            l3_experiments/13_theme_description_stage_custom_prompt.ipynb \
            l3_experiments/14_theme_needs_description_stage_custom_prompt.ipynb
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Set E12-E14 reasoning effort to low"
          git push
