name: Apply business-needs L3 experiments

on:
  push:
    paths:
      - "l3_experiments/_test_business_needs_experiments.py"
      - "l3_experiments/_apply_business_needs_experiments.py"
      - "l3_experiments/09_business_needs_stage.ipynb"
      - "l3_experiments/10_business_needs_theme_batch.ipynb"
      - ".github/workflows/business-needs-l3.yml"

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build E9 and E10 notebooks
        run: python l3_experiments/_apply_business_needs_experiments.py
      - name: Verify business-needs-only experiments
        run: python l3_experiments/_test_business_needs_experiments.py
      - name: Commit E9 and E10 notebooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add l3_experiments/09_business_needs_stage.ipynb l3_experiments/10_business_needs_theme_batch.ipynb
          git diff --cached --quiet && exit 0
          git commit -m "Add business-needs-only L3 experiments"
          git push
