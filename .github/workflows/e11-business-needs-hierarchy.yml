name: Apply E11 business-needs hierarchy batch

on:
  push:
    paths:
      - "l3_experiments/_test_e11.py"
      - "l3_experiments/_apply_e11.py"
      - "l3_experiments/11_business_needs_theme_batch_with_hierarchy.ipynb"
      - ".github/workflows/e11-business-needs-hierarchy.yml"

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build E11 notebook
        run: python l3_experiments/_apply_e11.py
      - name: Verify E11
        run: python l3_experiments/_test_e11.py
      - name: Commit E11 notebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add l3_experiments/11_business_needs_theme_batch_with_hierarchy.ipynb
          git diff --cached --quiet && exit 0
          git commit -m "Add E11 business-needs hierarchy batch experiment"
          git push
