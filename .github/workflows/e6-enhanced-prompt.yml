name: Apply E6 enhanced prompt

on:
  push:
    paths:
      - "l3_experiments/_test_e6_prompt.py"
      - "l3_experiments/_apply_e6_prompt.py"
      - "l3_experiments/06_enhanced_full_with_hierarchy.ipynb"
      - ".github/workflows/e6-enhanced-prompt.yml"

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build E6 enhanced prompt notebook
        run: python l3_experiments/_apply_e6_prompt.py
      - name: Verify E6 enhanced prompt experiment
        run: python l3_experiments/_test_e6_prompt.py
      - name: Commit E6 notebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add l3_experiments/06_enhanced_full_with_hierarchy.ipynb
          git diff --cached --quiet && exit 0
          git commit -m "Add enhanced E5 prompt experiment"
          git push
