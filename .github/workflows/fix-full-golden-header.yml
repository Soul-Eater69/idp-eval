name: Fix full golden notebook header

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-full-golden-header.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update notebook header
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('l3_experiments/00_fetch_full_golden_ground_truth.ipynb')
          nb = json.loads(path.read_text(encoding='utf-8'))
          first = nb['cells'][0]['source']
          first = first.replace(
              'This notebook does only four things:\n\n',
              'This notebook fetches Jira L3 ground truth and validates whether each Epic can be evaluated from its Stage-scoped L3 candidate set.\n\n',
          )
          first = first.replace(
              'It does **not** run LLM evaluation or invalid-Epic/candidate-coverage checks.',
              'It does **not** run LLM evaluation.',
          )
          nb['cells'][0]['source'] = first
          path.write_text(json.dumps(nb, indent=1, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-full-golden-header.yml
          git add l3_experiments/00_fetch_full_golden_ground_truth.ipynb
          git commit -m "Align full golden GT notebook description"
          git push
