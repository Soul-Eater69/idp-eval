name: Generate E12-E14 notebooks

on:
  push:
    branches: [main]
    paths:
      - 'l3_experiments/_generate_e12_e14.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate and structurally verify notebooks
        run: python l3_experiments/_generate_e12_e14.py

      - name: Commit generated notebooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            l3_experiments/12_business_needs_stage_custom_prompt.ipynb \
            l3_experiments/13_theme_description_stage_custom_prompt.ipynb \
            l3_experiments/14_theme_needs_description_stage_custom_prompt.ipynb
          if git diff --cached --quiet; then
            echo "No generated notebook changes to commit."
            exit 0
          fi
          git commit -m "Add E12-E14 custom prompt L3 experiments"
          git push
