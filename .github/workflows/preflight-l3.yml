name: Apply L3 preflight population

on:
  push:
    paths:
      - "l3_experiments/_test_preflight_population.py"
      - "l3_experiments/_apply_preflight_population.py"
      - ".github/workflows/preflight-l3.yml"

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply preflight refactor
        run: python l3_experiments/_apply_preflight_population.py
      - name: Verify preflight population behavior
        run: python l3_experiments/_test_preflight_population.py
      - name: Commit updated notebooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add l3_experiments/*.ipynb
          git diff --cached --quiet && exit 0
          git commit -m "Preflight valid L3 Epics before LLM calls"
          git push
