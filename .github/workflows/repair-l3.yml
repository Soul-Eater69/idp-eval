name: Test L3 evaluation population

on:
  push:
    paths:
      - "l3_experiments/_test_eval_population.py"
      - ".github/workflows/repair-l3.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify valid evaluation population behavior
        run: python l3_experiments/_test_eval_population.py
