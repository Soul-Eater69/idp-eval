name: Repair L3 notebooks

on:
  push:
    paths:
      - "l3_experiments/_repair_notebook_structure.py"
      - "l3_experiments/_test_eval_population.py"
      - ".github/workflows/repair-l3.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply evaluation population refactor
        run: python l3_experiments/_repair_notebook_structure.py
      - name: Verify evaluation population behavior
        run: python l3_experiments/_test_eval_population.py
      - name: Commit updated notebooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add l3_experiments/*.ipynb
          if git diff --cached --quiet; then
            echo "No notebook changes to commit."
          else
            git commit -m "Score only valid L3 evaluation Epics"
            git push
          fi
