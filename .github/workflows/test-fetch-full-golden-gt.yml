name: Verify full golden GT notebook

on:
  push:
    branches: [main]
    paths:
      - 'l3_experiments/_test_fetch_full_golden_gt.py'
      - 'l3_experiments/00_fetch_full_golden_ground_truth.ipynb'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run structural test
        run: python l3_experiments/_test_fetch_full_golden_gt.py
