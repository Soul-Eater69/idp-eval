name: Verify mixed experiment data paths

on:
  push:
    branches: [main]
    paths:
      - 'l3_experiments/_test_mixed_data_paths.py'
      - 'l3_experiments/12_business_needs_stage_custom_prompt.ipynb'
      - 'l3_experiments/13_theme_description_stage_custom_prompt.ipynb'
      - 'l3_experiments/14_theme_needs_description_stage_custom_prompt.ipynb'
      - '.github/workflows/test-mixed-data-paths.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run regression test
        run: python l3_experiments/_test_mixed_data_paths.py
