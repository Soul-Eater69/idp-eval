name: Apply corrected E17-E20 notebooks

on:
  push:
    paths:
      - '.github/workflows/tmp-apply-e17-e20.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate corrected notebooks
        run: python scripts/.tmp_update_e17_e20.py
      - name: Verify notebooks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files={
            17:Path('l3_experiments/17_theme_needs_description_stage_individual.ipynb'),
            18:Path('l3_experiments/18_business_needs_stage_individual.ipynb'),
            19:Path('l3_experiments/19_theme_needs_description_stage_batch.ipynb'),
            20:Path('l3_experiments/20_business_needs_stage_batch.ipynb'),
          }
          for n,p in files.items():
              nb=json.loads(p.read_text())
              src='\n'.join(c.get('source','') if isinstance(c.get('source',''),str) else ''.join(c.get('source',[])) for c in nb['cells'])
              assert 'golden_valid_set.parquet' in src
              assert 'epic_l3_ground_truth_full_golden.xlsx' in src
              for banned in ('full_golden.parquet','epic_gen.csv','VSSrv.csv','VSSCaprv (1).csv'):
                  assert banned not in src, (n,banned)
              assert 'FORMATTED USER PROMPT' in src
              for i,c in enumerate(nb['cells']):
                  if c['cell_type']=='code':
                      code=c['source'] if isinstance(c['source'],str) else ''.join(c['source'])
                      compile(code,f'{p}:cell{i}','exec')
              prompt='\n'.join((c['source'] if isinstance(c.get('source',''),str) else ''.join(c.get('source',[]))) for c in nb['cells'] if c['cell_type']=='code' and 'SYSTEM_PROMPT' in (c['source'] if isinstance(c.get('source',''),str) else ''.join(c.get('source',[]))))
              assert 'epic_key' not in prompt.lower()
              assert 'item_id' not in prompt
              assert ' epic' not in prompt.lower()
              if n in (17,19):
                  assert 'theme_business_needs' in prompt and 'theme_description' in prompt
              else:
                  assert 'theme_business_needs' in prompt and 'theme_description' not in prompt
              if n in (19,20):
                  assert 'stage_id' in prompt and '"stages"' in prompt
          assert not Path('l3_experiments/17_theme_description_stage_individual.ipynb').exists()
          assert not Path('l3_experiments/19_theme_description_stage_batch.ipynb').exists()
          print('E17-E20 verification passed')
          PY
      - name: Commit generated notebooks and clean temporary files
        run: |
          rm scripts/.tmp_update_e17_e20.py
          rm .github/workflows/tmp-apply-e17-e20.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Correct E17-E20 theme context experiments'
          git push
