name: Correct E17-E20 exact prompts

on:
  push:
    paths:
      - '.github/workflows/tmp-e17-e20-exact-prompts.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: RED - verify current notebooks fail new requirements
        run: |
          if python scripts/.tmp_check_e17_e20_exact_prompts.py; then
            echo "Expected current notebooks to fail the new requirements, but they passed."
            exit 1
          else
            echo "RED verified: current notebooks do not satisfy the new prompt/enrichment contract."
          fi

      - name: Apply notebook corrections
        run: python scripts/.tmp_update_e17_e20_exact_prompts.py

      - name: GREEN - verify corrected notebooks
        run: python scripts/.tmp_check_e17_e20_exact_prompts.py

      - name: Remove temporary updater and verifier
        run: |
          rm scripts/.tmp_update_e17_e20_exact_prompts.py
          rm scripts/.tmp_check_e17_e20_exact_prompts.py
          rm .github/workflows/tmp-e17-e20-exact-prompts.yml

      - name: Commit corrected notebooks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore rich Stage and L3 prompt context for E17-E20'
          git push
