name: E21 E22 RED verification

on:
  push:
    paths:
      - '.github/workflows/tmp-e21-e22-red.yml'

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tests fail before implementation
        run: |
          if python scripts/.tmp_check_e21_e22.py; then
            echo "Expected verifier to fail before E21/E22 exist, but it passed."
            exit 1
          fi
          echo "RED verified: E21/E22 requirements are not implemented yet."
