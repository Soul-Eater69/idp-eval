[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idp-eval"
version = "0.1.0"
description = "A reusable, Phoenix-backed evaluation framework for any generated AI output."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "arize-phoenix-evals>=0.13",
    "arize-phoenix-otel>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["idp_eval*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
