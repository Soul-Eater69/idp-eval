[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idp-eval"
version = "0.1.0"
description = "A reusable, Phoenix-backed evaluation framework for any generated AI output."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "arize-phoenix-client>=3.2.0",
    "arize-phoenix-evals>=0.13",
    "arize-phoenix-otel>=0.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
excel = ["openpyxl>=3.1"]
tracing = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
# Native Phoenix span-annotation output (output="phoenix"). Verified against
# arize-phoenix-client 3.2.0.
phoenix = ["arize-phoenix-client>=3"]
dev = [
    "pytest>=7",
    "pyyaml>=6",
    "openpyxl>=3.1",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "arize-phoenix-client>=3",
]

[tool.setuptools.packages.find]
include = ["idp_eval*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
